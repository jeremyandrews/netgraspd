; DHCP option 55 fingerprints, in the Fingerbank-derived format netgraspd reads.
;
; PROVENANCE. This file is a curated subset assembled from published DHCP
; parameter-request-list fingerprints, in the shape of the PacketFence and
; Fingerbank `dhcp_fingerprints.conf` files. It is NOT a verbatim copy of the
; upstream Fingerbank database, which is much larger and separately licensed.
; It is embedded in the binary at build time so that classification works with
; no runtime network dependency at all.
;
; `netgraspd update-fingerprints <url>` replaces it at runtime by downloading a
; file in this format, validating that it parses, and writing it to the
; configured path. The daemon prefers that file when it exists and falls back to
; this embedded copy when it does not. Nothing downloads on its own.
;
; FORMAT. INI-ish. Each section is one fingerprint class:
;
;   [<id>]
;   description  = human-readable name of the class
;   fingerprints = one or more option 55 lists, comma-separated within a list
;                  and pipe-separated between lists
;   os           = the os_family this class implies    (optional)
;   device_type  = the device_type this class implies  (optional)
;
; Unknown keys are ignored, so the larger upstream file parses here unchanged.
;
; ORDER MATTERS. Two operating systems routinely request the same set of options
; in a different order, and the order is most of the discriminating power. The
; lists below are written in the order the device puts them on the wire.
;
; DEVICE TYPES. Only the values in classify::DEVICE_TYPES are meaningful; a
; device_type outside that set is ignored rather than stored.

