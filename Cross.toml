# `cross` builds in a container that carries the target's sysroot and linker.
# What it does not carry is libpcap for the target architecture, which this
# daemon links against, so each target enables the foreign architecture and
# installs it before the build.
#
# Without this the build fails at link time with `cannot find -lpcap`, which is
# a confusing message for something that builds perfectly on the host.

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install --assume-yes libpcap-dev:arm64",
]

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update",
    "apt-get install --assume-yes libpcap-dev",
]
