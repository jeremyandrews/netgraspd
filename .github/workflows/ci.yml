name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Documentation builds
        run: cargo doc --no-deps

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netgrasp
          POSTGRES_PASSWORD: netgrasp
          POSTGRES_DB: netgrasp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netgrasp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The integration tests skip themselves when no database is reachable, so
      # this step asserts they actually ran rather than trusting a green tick.
      #
      # The guard greps for "skipping:" and not for the specific "no Postgres"
      # message. The narrower version let a whole binary skip on a different
      # message and report thirteen passing tests that had proved nothing.
      #
      # NETGRASPD_, not NETGRASP_: every NETGRASP_-prefixed variable is read as
      # configuration and unknown keys are rejected, so a harness variable under
      # that prefix breaks every configuration test in the same run.
      - name: Integration tests
        env:
          NETGRASPD_TEST_DATABASE_URL: postgres://netgrasp:netgrasp@localhost:5432/netgrasp
        run: |
          cargo test --test pipeline --test security --test schema \
                     --test location --test maintenance --test unifi \
                     -- --nocapture 2>&1 | tee integration.log
          if grep -q "skipping:" integration.log; then
            echo "::error::an integration test skipped itself; the database was not reachable"
            exit 1
          fi

      # Every integration target against one database in one command, which is
      # what catches cross-file interference through shared fixtures.
      - name: The whole suite against one database
        env:
          NETGRASPD_TEST_DATABASE_URL: postgres://netgrasp:netgrasp@localhost:5432/netgrasp
        run: cargo test --all

  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # The vendor registry is embedded at build time; a truncated or missing
      # data file would silently disable every vendor signal.
      - name: Vendor registry is present
        run: |
          entries=$(wc -l < data/oui.tsv)
          echo "$entries registry entries"
          test "$entries" -gt 40000

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit --deny warnings

  # Builds the image and publishes the binary inside it as a standalone
  # artifact, which is also the cross-compilation story.
  #
  # There is no separate `cross` job. It was tried and removed: cross's stock
  # image for aarch64 is Ubuntu 16.04 and cannot install libpcap for the foreign
  # architecture, so the build failed at `apt-get install libpcap-dev:arm64`.
  # Fighting the apt layout of somebody else's base image is not worth it when
  # this job already produces exactly the binary we want, on a current base, and
  # asserts that it runs.
  docker:
    name: image and binary (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            target: x86_64-unknown-linux-gnu
            arch: x86-64
          - platform: linux/arm64
            target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: netgraspd:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The image runs, and runs as the unprivileged user with no capabilities.
      # Every read-only command has to work without NET_RAW, or
      # `docker run netgraspd stats` is unusable on a perfectly healthy install.
      - name: The image runs unprivileged
        run: |
          expected="netgraspd $(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          got="$(docker run --rm --platform ${{ matrix.platform }} netgraspd:ci --version)"
          echo "$got"
          test "$got" = "$expected"
          docker run --rm --platform ${{ matrix.platform }} netgraspd:ci --help > /dev/null

      - name: Report the image size
        run: docker image ls netgraspd:ci --format '{{.Size}}'

      # The binary out of the image is the release artifact. `file` asserts it
      # really is for the architecture it claims, so an emulation or buildx
      # misconfiguration cannot ship an amd64 binary as the Raspberry Pi one.
      - name: Extract the binary
        run: |
          id=$(docker create --platform ${{ matrix.platform }} netgraspd:ci)
          docker cp "$id:/usr/local/bin/netgraspd" ./netgraspd-${{ matrix.target }}
          docker rm "$id"
          file ./netgraspd-${{ matrix.target }}
          file ./netgraspd-${{ matrix.target }} | grep -qi '${{ matrix.arch }}'

      - uses: actions/upload-artifact@v4
        with:
          name: netgraspd-${{ matrix.target }}
          path: netgraspd-${{ matrix.target }}
          if-no-files-found: error

  compose:
    name: docker compose is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A compose file that references an unset variable fails at `up`, long
      # after anybody has stopped watching. `config` resolves every one of them.
      - name: Validate
        run: |
          cp .env.example .env
          touch netgrasp.toml
          docker compose config > /dev/null
          docker compose --profile trovato config > /dev/null
