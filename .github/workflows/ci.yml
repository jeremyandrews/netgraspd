name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Documentation builds
        run: cargo doc --no-deps

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: netgrasp
          POSTGRES_PASSWORD: netgrasp
          POSTGRES_DB: netgrasp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netgrasp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The integration tests skip themselves when no database is reachable, so
      # this step asserts they actually ran rather than trusting a green tick.
      #
      # The guard greps for "skipping:" and not for the specific "no Postgres"
      # message. The narrower version let a whole binary skip on a different
      # message and report thirteen passing tests that had proved nothing.
      #
      # NETGRASPD_, not NETGRASP_: every NETGRASP_-prefixed variable is read as
      # configuration and unknown keys are rejected, so a harness variable under
      # that prefix breaks every configuration test in the same run.
      - name: Integration tests
        env:
          NETGRASPD_TEST_DATABASE_URL: postgres://netgrasp:netgrasp@localhost:5432/netgrasp
        run: |
          cargo test --test pipeline --test security --test schema \
                     --test location --test maintenance --test unifi \
                     -- --nocapture 2>&1 | tee integration.log
          if grep -q "skipping:" integration.log; then
            echo "::error::an integration test skipped itself; the database was not reachable"
            exit 1
          fi

      # Every integration target against one database in one command, which is
      # what catches cross-file interference through shared fixtures.
      - name: The whole suite against one database
        env:
          NETGRASPD_TEST_DATABASE_URL: postgres://netgrasp:netgrasp@localhost:5432/netgrasp
        run: cargo test --all

  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # The vendor registry is embedded at build time; a truncated or missing
      # data file would silently disable every vendor signal.
      - name: Vendor registry is present
        run: |
          entries=$(wc -l < data/oui.tsv)
          echo "$entries registry entries"
          test "$entries" -gt 40000

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit --deny warnings

  cross:
    name: cross compile (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `cross` builds inside a container that already carries the sysroot and
      # the linker for the target. Cross.toml adds libpcap for the target
      # architecture, which is the one thing the stock images do not have.
      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: The binary is for the architecture it claims
        run: |
          file target/${{ matrix.target }}/release/netgraspd
          case "${{ matrix.target }}" in
            aarch64-*) expected=aarch64 ;;
            *)         expected=x86-64 ;;
          esac
          file target/${{ matrix.target }}/release/netgraspd | grep -qi "$expected"

      - uses: actions/upload-artifact@v4
        with:
          name: netgraspd-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/netgraspd
          if-no-files-found: error

  docker:
    name: docker image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: netgraspd:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The image runs, and runs as the unprivileged user with no capabilities.
      # Every read-only command has to work without NET_RAW, or
      # `docker run netgraspd stats` is unusable on a perfectly healthy install.
      - name: The image runs unprivileged
        run: |
          expected="netgraspd $(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          got="$(docker run --rm --platform ${{ matrix.platform }} netgraspd:ci --version)"
          echo "$got"
          test "$got" = "$expected"
          docker run --rm --platform ${{ matrix.platform }} netgraspd:ci --help > /dev/null

      - name: Report the image size
        run: docker image ls netgraspd:ci --format '{{.Size}}'

  compose:
    name: docker compose is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A compose file that references an unset variable fails at `up`, long
      # after anybody has stopped watching. `config` resolves every one of them.
      - name: Validate
        run: |
          cp .env.example .env
          touch netgrasp.toml
          docker compose config > /dev/null
          docker compose --profile trovato config > /dev/null
